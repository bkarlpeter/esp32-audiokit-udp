; ============================================================
; esp32-audiokit-udp — PlatformIO project
;
; Flash slave first (so you can note its IP), then master.
;   pio run -e slave  -t upload
;   pio run -e master -t upload
; ============================================================

[platformio]
default_envs = slave

; ── Common settings ──────────────────────────────────────────
[env]
platform     = espressif32
board        = esp32dev
framework    = arduino
monitor_speed = 115200
lib_deps =
    ; AudioKit HAL (ES8388 codec support)
    pschatzmann/arduino-audiokit @ ^1.3.0
    ; High-level audio streaming API
    pschatzmann/arduino-audio-tools @ ^0.9.0
build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; Board variant: 5 = AI-Thinker ESP32-A1S v2.2 (ES8388)
    ; Change to 6 for v2.3 if codec does not initialise.
    ; See arduino-audiokit/src/AudioKitConfig.h for the full list.
    -DAUDIOKIT_BOARD=5

; ── Master environment ────────────────────────────────────────
[env:master]
build_flags =
    ${env.build_flags}
    -DMASTER_MODE=1

; ── Slave environment ─────────────────────────────────────────
[env:slave]
; No extra flags — absence of MASTER_MODE selects slave code.
