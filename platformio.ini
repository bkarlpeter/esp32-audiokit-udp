; ============================================================
;  PlatformIO Project Configuration
;  Target: AI-Thinker ESP32-A1S AudioKit (ES8388 codec)
;
;  Flash master:  pio run -e master -t upload
;  Flash slave:   pio run -e slave  -t upload
;  Open monitor:  pio device monitor
; ============================================================

[common]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
lib_deps      =
build_flags   =
    -DCORE_DEBUG_LEVEL=1
    -std=gnu++17

[env:master]
extends     = common
build_flags =
    ${common.build_flags}
    -DMASTER_MODE=1

[env:slave]
extends     = common
build_flags =
    ${common.build_flags}
    -DSLAVE_MODE=1
